[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "PyWKSpectra"
version = "1.0"
description = "Wheeler-Kiladis Space-Time Spectral Analysis in Python"
readme = "README.md"
requires-python = ">=3.10"

license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/*.txt"]

authors = [
    {name = "Alejandro Jaramillo-Moreno", email = "ajaramillo@atmosfera.unam.mx"}
]

keywords = [
    "Wheeler-Kiladis",
    "space-time spectra",
    "equatorial waves",
    "tropical meteorology",
    "atmospheric dynamics"
]

dependencies = [
    "numpy>=1.24",
    "xarray>=2023.1",
    "matplotlib>=3.7",
    "netCDF4>=1.6",
    "cfgrib"
]


[project.urls]
Homepage = "https://github.com/ajaramillomoreno/PyWKSpectra"
Repository = "https://github.com/ajaramillomoreno/PyWKSpectra"
Documentation = "https://github.com/ajaramillomoreno/PyWKSpectra/blob/main/docs/methodology.md"
Issues = "https://github.com/ajaramillomoreno/PyWKSpectra/issues"
"Author ORCID" = "https://orcid.org/0000-0002-4175-7726"


[tool.setuptools.packages.find]
where = ["src"]
